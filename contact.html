    <main>
      <header class="contact-section">
        <div class="contact-content row g-5">
          <div class="contact-text col-12 col-lg-5">
            <span>Kontakt</span>

            <h1 style="padding-top: 148px;">Lass uns loslegen.</h1>

            <p>
              <span class="contact-intro-question">Du hast eine Idee?</span>
              <span class="contact-intro-answer">Lass uns darüber sprechen.</span>
            </p>
          </div>

          <form class="contact-form col-12 col-lg-7" action="https://formspree.io/f/mrpevjda" method="POST">
            <input id="contact-project-type" type="hidden" name="Projektart" value="" />
            <fieldset class="project-picker">
              <legend>Worum geht es? *</legend>
              <div class="project-chips" aria-label="Projektart auswählen">
                <button type="button" data-project-type="Website" aria-pressed="false">Website</button>
                <button type="button" data-project-type="Branding" aria-pressed="false">Branding</button>
                <button type="button" data-project-type="UI/UX" aria-pressed="false">UI/UX</button>
                <button type="button" data-project-type="Sonstiges" aria-pressed="false">Sonstiges</button>
              </div>
            </fieldset>
            <div class="form-row row g-3">
              <div class="col-12 col-md-4">
                <label class="visually-hidden" for="contact-first-name">Vorname</label>
                <input id="contact-first-name" type="text" name="Vorname" placeholder="Vorname *" autocomplete="given-name" required />
              </div>

              <div class="col-12 col-md-4">
                <label class="visually-hidden" for="contact-last-name">Nachname</label>
                <input id="contact-last-name" type="text" name="Nachname" placeholder="Nachname *" autocomplete="family-name" required />
              </div>

              <div class="col-12 col-md-4">
                <label class="visually-hidden" for="contact-email">E-Mail</label>
                <input id="contact-email" type="email" name="email" placeholder="E-Mail *" autocomplete="email" required />
              </div>
            </div>

            <label class="visually-hidden" for="contact-subject">Betreff</label>
            <input id="contact-subject" type="text" name="subject" placeholder="Betreff *" required />

            <label class="visually-hidden" for="contact-message">Nachricht</label>
            <textarea id="contact-message" name="message" placeholder="Nachricht *" required></textarea>

            <button type="submit">Nachricht senden →</button>
            <p class="form-status" role="status" aria-live="polite" hidden></p>
          </form>
        </div>
      </header>
    </main>
